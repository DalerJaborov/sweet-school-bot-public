<!doctype html>
<html lang="ru">
  <head>
    <!-- Панель всегда светлая (решение владельца): фиксируем и на уровне
         браузера, иначе телефон с тёмной системной темой на миг красит страницу
         чёрным до загрузки скриптов. -->
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f3f2ef" />
    <!-- Панель как приложение: свой манифест (область /panel/), не путать с
         приложением учениц (manifest.webmanifest, /course). -->
    <link rel="manifest" href="/panel.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shirin" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Shirin — панель</title>
    <!-- Те же шрифты, что у приложения ученицы (course.html): Inter для текста
         (cyrillic-ext — таджикские ӣ ӯ ҳ қ ҷ ғ в никах и текстах учениц),
         Onest 800 — дисплейный акцент цифр и заголовков. Один бренд на оба
         экрана — см. src/tokens.css. -->
    <link rel="icon" href="/favicon.ico?v=20261108-brand" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg?v=20261108-brand" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png?v=20261108-brand" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Скрипт Telegram нужен, только когда панель открыта как мини-приложение;
         в обычном браузере он просто ничего не делает. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
