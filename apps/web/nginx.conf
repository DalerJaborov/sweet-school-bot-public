server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # TLS terminates at Caddy. Relative redirects retain the caller's HTTPS.
    absolute_redirect off;

    # Сайт shirinsweets.online — статичные страницы, сгенерированные на сборке
    # (scripts/build-site-pages.mjs): site.html, online-kurs.html, …, tg/*.html.
    # Чистые адреса: /online-kurs → /online-kurs.html, /tg/faq → /tg/faq.html.
    error_page 404 /404.html;

    # One public host and one URL for every locale page. request_uri keeps
    # internal rewrites (e.g. / -> /site.html) from redirecting in a loop.
    if ($host = www.shirinsweets.online) { return 301 https://shirinsweets.online$request_uri; }
    if ($request_uri ~ "^/site\.html(?:\?|$)") { return 301 /$is_args$args; }
    if ($request_uri ~ "^/tg/index\.html(?:\?|$)") { return 301 /tg/$is_args$args; }
    if ($request_uri ~ "^/(tg/)?(online-kurs|art-desserty|kursy-konditera-dushanbe|sertifikat|otzyvy|faq|o-shirin|politika-konfidentsialnosti)\.html(?:\?|$)") {
        return 301 /$1$2$is_args$args;
    }
    if ($request_uri ~ "^/(tg/)?(online-kurs|art-desserty|kursy-konditera-dushanbe|sertifikat|otzyvy|faq|o-shirin|politika-konfidentsialnosti)/+(?:\?|$)") {
        return 301 /$1$2$is_args$args;
    }
    location = /tg { return 301 /tg/$is_args$args; }

    # Платформа курсов — отдельное приложение для учениц (course.html).
    # Стоит ВЫШЕ общего location /, иначе путь /course отдавал бы панель.
    location = /course {
        try_files /course.html =404;
    }
    location /course/ {
        try_files $uri /course.html;
    }
    # Короткие ссылки из директа: /l/Ab3kQ9xZpm — приложение прочитает код
    # из адреса само (hooks/useCourse.ts).
    location /l/ {
        try_files /course.html =404;
    }

    # Панель владельца переехала на /panel (index.html). Старый домен
    # sweetbot.royalhome.tj во время переезда по-прежнему открывает панель
    # с корня — см. location = / ниже. Панель не использует путь адреса
    # (src/App.tsx без роутера), поэтому /panel/* можно отдавать одним файлом.
    location = /panel {
        try_files /index.html =404;
    }
    location /panel/ {
        try_files $uri /index.html;
    }

    # Корень: на shirinsweets.online — главная сайта, на старом домене — панель.
    location = / {
        if ($host ~* ^(www\.)?shirinsweets\.online$) { rewrite ^ /site.html last; }
        try_files /index.html =404;
    }

    # Таджикское зеркало сайта: /tg/ → tg/index.html, /tg/faq → tg/faq.html.
    location /tg/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Android-обёртка (исходники — android-app/ в корне репозитория) — .apk
    # для прямого скачивания с сайта, не через Google Play. Базовый
    # mime.types в образе nginx:alpine не знает про .apk: без явного типа
    # браузер получил бы application/octet-stream и не предложил бы установку.
    location = /app/shirin-sweets.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="shirin-sweets.apk"';
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Digital Asset Links — доказывает Android'у, что online.shirinsweets.course
    # (android-app/) и этот домен принадлежат одному владельцу, иначе Android
    # App Links (intent-filter android:autoVerify="true" в манифесте) не
    # сработают и ссылки из Instagram/WhatsApp будут открываться в браузере,
    # а не в приложении. Явный тип обязателен — .json нет в базовом
    # mime.types образа nginx:alpine, без него отдался бы octet-stream, а
    # проверка Google ожидает application/json.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Service Worker должен видеть весь сайт, поэтому его нельзя кешировать
    # надолго: иначе обновление приложения не доедет до телефона неделями.
    location = /course-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # Страницы сайта по чистым адресам; чего нет — честный 404 (404.html),
    # а не панель: поисковику важно, чтобы несуществующее отвечало 404.
    location / {
        try_files $uri $uri.html =404;
    }

    # API платформы курсов: сессия ученицы живёт в куке, поэтому важно не
    # потерять заголовки при проксировании.
    location /api/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # Вебхуки и админ-API проксируем в контейнер бота, чтобы панель и сервер
    # жили на одном адресе (без CORS и без второго поддомена).
    location /admin/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-form/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:4100;
    }

    # Загруженные фото/видео для шагов воронки. ^~ обязателен: без него ниже
    # стоящий regex-location по расширению файла (.jpg/.png/...) перехватил бы
    # запрос раньше — у regex-локаций в nginx приоритет выше простого префикса.
    location ^~ /media/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
