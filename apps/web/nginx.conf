server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # TLS terminates at Caddy. Relative redirects retain the caller's HTTPS.
    absolute_redirect off;

    # РЎР°Р№С‚ shirinsweets.online вЂ” СЃС‚Р°С‚РёС‡РЅС‹Рµ СЃС‚СЂР°РЅРёС†С‹, СЃРіРµРЅРµСЂРёСЂРѕРІР°РЅРЅС‹Рµ РЅР° СЃР±РѕСЂРєРµ
    # (scripts/build-site-pages.mjs): site.html, online-kurs.html, вЂ¦, tg/*.html.
    # Р§РёСЃС‚С‹Рµ Р°РґСЂРµСЃР°: /online-kurs в†’ /online-kurs.html, /tg/faq в†’ /tg/faq.html.
    error_page 404 /404.html;

    # One public host and one URL for every locale page. request_uri keeps
    # internal rewrites (e.g. / -> /site.html) from redirecting in a loop.
    if ($host = www.shirinsweets.online) { return 301 https://shirinsweets.online$request_uri; }
    if ($request_uri ~ "^/site\.html(?:\?|$)") { return 301 /$is_args$args; }
    if ($request_uri ~ "^/tg/index\.html(?:\?|$)") { return 301 /tg/$is_args$args; }
    if ($request_uri ~ "^/(tg/)?(online-kurs|art-desserty|kursy-konditera-dushanbe|sertifikat|otzyvy|faq|o-shirin|politika-konfidentsialnosti)\.html(?:\?|$)") {
        return 301 /$1$2$is_args$args;
    }
    if ($request_uri ~ "^/(tg/)?(online-kurs|art-desserty|kursy-konditera-dushanbe|sertifikat|otzyvy|faq|o-shirin|politika-konfidentsialnosti)/+(?:\?|$)") {
        return 301 /$1$2$is_args$args;
    }
    location = /tg { return 301 /$is_args$args; }
    location = /tg/ { return 301 /$is_args$args; }
    location = /ru { return 301 /ru/$is_args$args; }
    location = /ru/ { try_files /ru/index.html =404; }
    if ($request_uri ~ "^/ru/index\.html(?:\?|$)") { return 301 /ru/$is_args$args; }

    # РџР»Р°С‚С„РѕСЂРјР° РєСѓСЂСЃРѕРІ вЂ” РѕС‚РґРµР»СЊРЅРѕРµ РїСЂРёР»РѕР¶РµРЅРёРµ РґР»СЏ СѓС‡РµРЅРёС† (course.html).
    # РЎС‚РѕРёС‚ Р’Р«РЁР• РѕР±С‰РµРіРѕ location /, РёРЅР°С‡Рµ РїСѓС‚СЊ /course РѕС‚РґР°РІР°Р» Р±С‹ РїР°РЅРµР»СЊ.
    location = /course {
        try_files /course.html =404;
    }
    location /course/ {
        try_files $uri /course.html;
    }
    # РљРѕСЂРѕС‚РєРёРµ СЃСЃС‹Р»РєРё РёР· РґРёСЂРµРєС‚Р°: /l/Ab3kQ9xZpm вЂ” РїСЂРёР»РѕР¶РµРЅРёРµ РїСЂРѕС‡РёС‚Р°РµС‚ РєРѕРґ
    # РёР· Р°РґСЂРµСЃР° СЃР°РјРѕ (hooks/useCourse.ts).
    location /l/ {
        try_files /course.html =404;
    }

    # РџР°РЅРµР»СЊ РІР»Р°РґРµР»СЊС†Р° РїРµСЂРµРµС…Р°Р»Р° РЅР° /panel (index.html). РЎС‚Р°СЂС‹Р№ РґРѕРјРµРЅ
    # sweetbot.royalhome.tj РІРѕ РІСЂРµРјСЏ РїРµСЂРµРµР·РґР° РїРѕ-РїСЂРµР¶РЅРµРјСѓ РѕС‚РєСЂС‹РІР°РµС‚ РїР°РЅРµР»СЊ
    # СЃ РєРѕСЂРЅСЏ вЂ” СЃРј. location = / РЅРёР¶Рµ. РџР°РЅРµР»СЊ РЅРµ РёСЃРїРѕР»СЊР·СѓРµС‚ РїСѓС‚СЊ Р°РґСЂРµСЃР°
    # (src/App.tsx Р±РµР· СЂРѕСѓС‚РµСЂР°), РїРѕСЌС‚РѕРјСѓ /panel/* РјРѕР¶РЅРѕ РѕС‚РґР°РІР°С‚СЊ РѕРґРЅРёРј С„Р°Р№Р»РѕРј.
    location = /panel {
        try_files /index.html =404;
    }
    location /panel/ {
        try_files $uri /index.html;
    }

    # РљРѕСЂРµРЅСЊ: РЅР° shirinsweets.online вЂ” РіР»Р°РІРЅР°СЏ СЃР°Р№С‚Р°, РЅР° СЃС‚Р°СЂРѕРј РґРѕРјРµРЅРµ вЂ” РїР°РЅРµР»СЊ.
    location = / {
        if ($host ~* ^(www\.)?shirinsweets\.online$) { rewrite ^ /site.html last; }
        return 302 https://shirinsweets.online/panel;
    }

    # РўР°РґР¶РёРєСЃРєРѕРµ Р·РµСЂРєР°Р»Рѕ СЃР°Р№С‚Р°: /tg/ в†’ tg/index.html, /tg/faq в†’ tg/faq.html.
    location /tg/ {
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Android-РѕР±С‘СЂС‚РєР° (РёСЃС…РѕРґРЅРёРєРё вЂ” android-app/ РІ РєРѕСЂРЅРµ СЂРµРїРѕР·РёС‚РѕСЂРёСЏ) вЂ” .apk
    # РґР»СЏ РїСЂСЏРјРѕРіРѕ СЃРєР°С‡РёРІР°РЅРёСЏ СЃ СЃР°Р№С‚Р°, РЅРµ С‡РµСЂРµР· Google Play. Р‘Р°Р·РѕРІС‹Р№
    # mime.types РІ РѕР±СЂР°Р·Рµ nginx:alpine РЅРµ Р·РЅР°РµС‚ РїСЂРѕ .apk: Р±РµР· СЏРІРЅРѕРіРѕ С‚РёРїР°
    # Р±СЂР°СѓР·РµСЂ РїРѕР»СѓС‡РёР» Р±С‹ application/octet-stream Рё РЅРµ РїСЂРµРґР»РѕР¶РёР» Р±С‹ СѓСЃС‚Р°РЅРѕРІРєСѓ.
    location = /app/shirin-sweets.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="shirin-sweets.apk"';
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Digital Asset Links вЂ” РґРѕРєР°Р·С‹РІР°РµС‚ Android'Сѓ, С‡С‚Рѕ online.shirinsweets.course
    # (android-app/) Рё СЌС‚РѕС‚ РґРѕРјРµРЅ РїСЂРёРЅР°РґР»РµР¶Р°С‚ РѕРґРЅРѕРјСѓ РІР»Р°РґРµР»СЊС†Сѓ, РёРЅР°С‡Рµ Android
    # App Links (intent-filter android:autoVerify="true" РІ РјР°РЅРёС„РµСЃС‚Рµ) РЅРµ
    # СЃСЂР°Р±РѕС‚Р°СЋС‚ Рё СЃСЃС‹Р»РєРё РёР· Instagram/WhatsApp Р±СѓРґСѓС‚ РѕС‚РєСЂС‹РІР°С‚СЊСЃСЏ РІ Р±СЂР°СѓР·РµСЂРµ,
    # Р° РЅРµ РІ РїСЂРёР»РѕР¶РµРЅРёРё. РЇРІРЅС‹Р№ С‚РёРї РѕР±СЏР·Р°С‚РµР»РµРЅ вЂ” .json РЅРµС‚ РІ Р±Р°Р·РѕРІРѕРј
    # mime.types РѕР±СЂР°Р·Р° nginx:alpine, Р±РµР· РЅРµРіРѕ РѕС‚РґР°Р»СЃСЏ Р±С‹ octet-stream, Р°
    # РїСЂРѕРІРµСЂРєР° Google РѕР¶РёРґР°РµС‚ application/json.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Service Worker РґРѕР»Р¶РµРЅ РІРёРґРµС‚СЊ РІРµСЃСЊ СЃР°Р№С‚, РїРѕСЌС‚РѕРјСѓ РµРіРѕ РЅРµР»СЊР·СЏ РєРµС€РёСЂРѕРІР°С‚СЊ
    # РЅР°РґРѕР»РіРѕ: РёРЅР°С‡Рµ РѕР±РЅРѕРІР»РµРЅРёРµ РїСЂРёР»РѕР¶РµРЅРёСЏ РЅРµ РґРѕРµРґРµС‚ РґРѕ С‚РµР»РµС„РѕРЅР° РЅРµРґРµР»СЏРјРё.
    location = /course-sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # РЎС‚СЂР°РЅРёС†С‹ СЃР°Р№С‚Р° РїРѕ С‡РёСЃС‚С‹Рј Р°РґСЂРµСЃР°Рј; С‡РµРіРѕ РЅРµС‚ вЂ” С‡РµСЃС‚РЅС‹Р№ 404 (404.html),
    # Р° РЅРµ РїР°РЅРµР»СЊ: РїРѕРёСЃРєРѕРІРёРєСѓ РІР°Р¶РЅРѕ, С‡С‚РѕР±С‹ РЅРµСЃСѓС‰РµСЃС‚РІСѓСЋС‰РµРµ РѕС‚РІРµС‡Р°Р»Рѕ 404.
    location / {
        try_files $uri $uri.html =404;
    }

    # API РїР»Р°С‚С„РѕСЂРјС‹ РєСѓСЂСЃРѕРІ: СЃРµСЃСЃРёСЏ СѓС‡РµРЅРёС†С‹ Р¶РёРІС‘С‚ РІ РєСѓРєРµ, РїРѕСЌС‚РѕРјСѓ РІР°Р¶РЅРѕ РЅРµ
    # РїРѕС‚РµСЂСЏС‚СЊ Р·Р°РіРѕР»РѕРІРєРё РїСЂРё РїСЂРѕРєСЃРёСЂРѕРІР°РЅРёРё.
    location /api/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    # Р’РµР±С…СѓРєРё Рё Р°РґРјРёРЅ-API РїСЂРѕРєСЃРёСЂСѓРµРј РІ РєРѕРЅС‚РµР№РЅРµСЂ Р±РѕС‚Р°, С‡С‚РѕР±С‹ РїР°РЅРµР»СЊ Рё СЃРµСЂРІРµСЂ
    # Р¶РёР»Рё РЅР° РѕРґРЅРѕРј Р°РґСЂРµСЃРµ (Р±РµР· CORS Рё Р±РµР· РІС‚РѕСЂРѕРіРѕ РїРѕРґРґРѕРјРµРЅР°).
    location /admin/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-form/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhooks/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:4100;
    }

    # Р—Р°РіСЂСѓР¶РµРЅРЅС‹Рµ С„РѕС‚Рѕ/РІРёРґРµРѕ РґР»СЏ С€Р°РіРѕРІ РІРѕСЂРѕРЅРєРё. ^~ РѕР±СЏР·Р°С‚РµР»РµРЅ: Р±РµР· РЅРµРіРѕ РЅРёР¶Рµ
    # СЃС‚РѕСЏС‰РёР№ regex-location РїРѕ СЂР°СЃС€РёСЂРµРЅРёСЋ С„Р°Р№Р»Р° (.jpg/.png/...) РїРµСЂРµС…РІР°С‚РёР» Р±С‹
    # Р·Р°РїСЂРѕСЃ СЂР°РЅСЊС€Рµ вЂ” Сѓ regex-Р»РѕРєР°С†РёР№ РІ nginx РїСЂРёРѕСЂРёС‚РµС‚ РІС‹С€Рµ РїСЂРѕСЃС‚РѕРіРѕ РїСЂРµС„РёРєСЃР°.
    location ^~ /media/ {
        proxy_pass http://api:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
