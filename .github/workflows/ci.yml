name: Source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reject private or mixed Git ancestry
        run: test "$(git rev-list --max-parents=0 HEAD)" = 'd5108a0f2c372367d111ab76be90cf2921d3adbc'
      - name: Scan public Git history for secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --dir "$RUNNER_TEMP/gitleaks"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | (cd "$RUNNER_TEMP/gitleaks" && sha256sum --check)
          tar -xzf "$RUNNER_TEMP/gitleaks/gitleaks_8.30.1_linux_x64.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --log-opts=--all --redact --no-banner
      - run: npm ci --no-audit --no-fund
      - run: npm run prisma:generate
      - name: Prepare the isolated application data volume
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /data
      - run: npm exec --workspace=apps/api -- vitest run --maxWorkers=4
      - run: npm exec --workspace=apps/web -- vitest run --maxWorkers=4
      - run: npm run build
