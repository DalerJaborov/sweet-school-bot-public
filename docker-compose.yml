services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      # connection_limit=1 — у SQLite один писатель физически. Пул из
      # нескольких соединений не ускоряет запись, а превращает её в гонку с
      # ошибками "database is locked"; очередь лучше держать в Prisma.
      DATABASE_URL: file:/data/bot.db?connection_limit=1&socket_timeout=15
      PORT: "4100"
      NODE_ENV: production
      # Вход в панель: 0 = пароль + подпись Telegram (по умолчанию, решение владельца 08.11.2026),
      # 1 = только Cloudflare Access (тогда нужны четыре переменные ниже).
      SCHOOL_ACCESS_REQUIRED: ${SCHOOL_ACCESS_REQUIRED:?Set SCHOOL_ACCESS_REQUIRED to 0 or 1}
      SCHOOL_ACCESS_TEAM_DOMAIN: ${SCHOOL_ACCESS_TEAM_DOMAIN:-}
      SCHOOL_ACCESS_AUDIENCE: ${SCHOOL_ACCESS_AUDIENCE:-}
      SCHOOL_ADMIN_EMAIL: ${SCHOOL_ADMIN_EMAIL:-}
      SCHOOL_ADMIN_ORIGINS: ${SCHOOL_ADMIN_ORIGINS:-}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      IG_PROXY_BASE: ${IG_PROXY_BASE:-}
      IG_PROXY_KEY: ${IG_PROXY_KEY:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      ELEVENLABS_MODEL: ${ELEVENLABS_MODEL:-eleven_v3}
      SCHOOL_WHATSAPP_URL: ${SCHOOL_WHATSAPP_URL:-}
      SCHOOL_WHATSAPP_TOKEN: ${SCHOOL_WHATSAPP_TOKEN:-}
      # Временные файлы перекодировки — на том же томе, что и данные. /tmp
      # контейнера живёт на оверлее корневого диска, и HLS двухгигабайтного
      # урока (исходник + две дорожки) забил бы его целиком.
      TMPDIR: /data/tmp
    volumes:
      - bot-data:/data
    expose:
      - "4100"
    # Дать время дослать ответы клиенткам и закрыть базу: по умолчанию Docker
    # шлёт SIGKILL через 10 с, ровно когда наш собственный аварийный выход
    # тоже срабатывает (index.ts gracefulShutdown).
    stop_grace_period: 20s

  whatsapp:
    profiles: ["whatsapp"]
    build:
      context: services/whatsapp-bridge
    restart: unless-stopped
    init: true
    environment:
      SCHOOL_WHATSAPP_TOKEN: ${SCHOOL_WHATSAPP_TOKEN:-}
      SCHOOL_WHATSAPP_MEDIA_HOSTS: ${SCHOOL_WHATSAPP_MEDIA_HOSTS:-shirinsweets.online}
      # Номера владельца для проверки бота: бот отвечает им, даже если они сохранены в телефоне Ширин (через запятую, цифры).
      SCHOOL_WHATSAPP_TEST_NUMBERS: ${SCHOOL_WHATSAPP_TEST_NUMBERS:-}
    volumes:
      - whatsapp-data:/data
    expose:
      - "4200"
    mem_limit: 1536m
    cpus: 1.5
    shm_size: 256m
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # Наружу не смотрит: снаружи стоит Caddy, он и держит TLS.
    ports:
      - "127.0.0.1:8091:80"

volumes:
  bot-data:
  whatsapp-data:
